name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk HarmonicaPlayAlong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HarmonicaPlayAlong-${{ github.run_number }}
          path: HarmonicaPlayAlong.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Harmonica Play-Along 1.0.${{ github.run_number }}
          body: Install HarmonicaPlayAlong.apk on your phone. Later builds install over it and keep your scores and settings.
          files: HarmonicaPlayAlong.apk
          make_latest: true
